apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: satellite-tracker
spec:
  replicas: 2 # the API is stateless, so unlike Postgres it can safely run more than one copy
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: satellite-tracker-api:local # built locally and loaded into minikube, see README
          imagePullPolicy: Never # tells k8s "don't try to pull this from a registry, it's already local"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
