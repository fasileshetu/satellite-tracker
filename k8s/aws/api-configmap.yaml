apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: satellite-tracker
data:
  PORT: "8080"
  # DATABASE_URL is deliberately NOT here — it contains the RDS password,
  # so it lives in a Kubernetes Secret instead (created directly with
  # kubectl, never committed to git). See the AWS section of the README.
  #
  # OIDC_ISSUER_URL and OIDC_CLIENT_ID are safe to put in a plain
  # ConfigMap (not a Secret) -- neither is sensitive. A client_id is
  # meant to be public (it's visible in every browser request a real
  # frontend would make); the issuer URL is just Cognito's public
  # well-known endpoint. Replace these with the real values from
  # `terraform output cognito_issuer_url` / `cognito_app_client_id`.
  OIDC_ISSUER_URL: "https://cognito-idp.us-west-2.amazonaws.com/us-west-2_70mc7L6QA"
  OIDC_CLIENT_ID: "7sm51edkgkkg7sqlo1ihuh1tl7"
