# This ServiceAccount is what IRSA hooks into: the annotation tells EKS
# which IAM role a pod using this ServiceAccount is allowed to assume.
# The "system:serviceaccount:satellite-tracker:grpc-server" string that
# terraform/dynamodb.tf's trust policy checks for is exactly
# "system:serviceaccount:<namespace>:<name>" from this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpc-server
  namespace: satellite-tracker
  annotations:
    # Replace with the value of `terraform output grpc_server_role_arn`
    eks.amazonaws.com/role-arn: arn:aws:iam::537124951411:role/satellite-tracker-grpc-server
